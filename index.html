<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nilavara Yuran</title>
<meta name="theme-color" content="#16142b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yuran Nilavara">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/playfair-display-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/playfair-display-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:500;font-display:swap;src:url(assets/fonts/playfair-display-latin-500-italic.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/inter-latin-600-normal.woff2) format('woff2')}
:root{
  --bg:#f6f3fb; --bg2:#fbf7f3;
  --card:rgba(255,255,255,.72); --card-solid:#fff; --line:rgba(22,20,43,.08); --glass-edge:rgba(255,255,255,.95);
  --ink:#16142b; --muted:#6e6a80; --faint:#a19cb3;
  --accent:#7c6cd6; --accent-2:#9a8cf0; --accent-soft:#ece8fb;
  --gold:#b8913a; --gold-soft:#f6eedb;
  --ok:#2f8a5f; --ok-soft:#e3f3ea; --bad:#c2485a; --bad-soft:#fbe6ea;
  --shadow:0 24px 60px -20px rgba(124,108,214,.28),0 2px 6px rgba(22,20,43,.04);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:22px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 60%,#f3f0fb 100%);color:var(--ink);font:15px/1.55 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.orbs i:nth-child(1){width:520px;height:520px;background:#dcd3ff;top:-160px;right:-120px}
.orbs i:nth-child(2){width:420px;height:420px;background:#ffe3d6;bottom:-160px;left:10%}
.orbs i:nth-child(3){width:300px;height:300px;background:#f1e6c8;top:40%;right:20%;opacity:.35}
.app{position:relative;z-index:1;display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;padding:28px 20px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line);background:rgba(255,255,255,.35);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#0b0b0b;box-shadow:0 6px 18px -6px rgba(184,145,58,.6),0 0 0 1px rgba(184,145,58,.4)}
.brand b{display:block;font:600 19px/1.1 var(--serif);letter-spacing:.02em}
.brand small{display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:baseline;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;transition:.2s}
.nav a .n{font:500 12px var(--serif);color:var(--faint);width:18px}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.nav a.on{color:var(--ink);background:var(--card-solid);box-shadow:var(--shadow)}
.nav a.on .n{color:var(--accent)}
.side-foot{margin-top:auto;font-size:11px;color:var(--faint);letter-spacing:.06em}
/* Main */
main{min-width:0;padding:40px clamp(16px,4vw,56px) 80px;max-width:1240px;width:100%}
.ph{margin-bottom:28px}
.eyebrow{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eyebrow span{letter-spacing:.2em}
h1{font:500 clamp(34px,5vw,52px)/1.05 var(--serif);margin:14px 0 0;letter-spacing:-.01em}
h1 em,h2 em,h3 em{font-style:italic;color:var(--accent)}
h2{font:500 24px/1.2 var(--serif);margin:0 0 4px}
h3{font:500 19px/1.2 var(--serif);margin:0}
.rule{width:36px;height:1px;background:var(--ink);opacity:.35;margin:18px 0 12px}
.lede{color:var(--muted);margin:0;max-width:60ch}
.card{background:var(--card);border:1px solid var(--glass-edge);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(20px);padding:24px}
.card + .card{margin-top:20px}
.grid > .card{margin-top:0}
.grid > *{min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-h .eyebrow{display:block}
.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1.4fr 1fr}
.kpi .eyebrow{display:block;font-size:10px}
.kpi .v{font:500 clamp(22px,2.2vw,30px)/1.1 var(--serif);margin:12px 0 4px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:linear-gradient(140deg,#fff 0%,var(--accent-soft) 100%)}
.kpi.gold .v{color:var(--gold)}
/* Chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#d8d1fa,#c3b8f5);min-height:3px;transition:height .5s}
.bar.now i{background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.bar span{font-size:10px;color:var(--faint);letter-spacing:.06em}
/* Tables */
.tw{overflow-x:auto;margin:0 -8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12px;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:36px;text-align:center;color:var(--muted);font-style:italic;font-family:var(--serif)}
/* Pills */
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.mute{background:#eeedf2;color:var(--muted)}
/* Forms */
label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 4px var(--accent-soft)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
.fg{display:grid;gap:16px}
.fg.c2{grid-template-columns:1fr 1fr}
.fg.c3{grid-template-columns:repeat(3,1fr)}
.full{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font:500 14px var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:10px 18px;cursor:pointer;text-decoration:none;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(22,20,43,.3)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.wa{background:#1fa855;color:#fff;border-color:#1fa855}
.link{display:inline-flex;align-items:center;gap:14px;font-weight:500;color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font-size:14px}
.link u{text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:4px}
.arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 10px 24px -8px rgba(124,108,214,.7);font-size:18px}
/* Payment builder */
.items{display:flex;flex-direction:column;gap:8px}
.item{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0;cursor:pointer;display:grid;grid-template-columns:auto 1fr 130px;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.6)}
.item.on{border-color:var(--accent-2);background:#fff}
.item .t b{font-weight:500}
.item .t small{display:block;color:var(--muted);font-size:12px}
.item input[type=number]{text-align:right;padding:8px 10px}
.total-box{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 4px;border-top:1px solid var(--line);margin-top:16px}
.total-box .v{font:500 34px var(--serif)}
.section-t{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
/* Modal */
dialog{border:0;border-radius:26px;padding:0;max-width:min(620px,calc(100vw - 32px));width:100%;background:#fff;color:var(--ink);box-shadow:0 40px 120px -20px rgba(22,20,43,.45)}
dialog::backdrop{background:rgba(22,20,43,.35);backdrop-filter:blur(4px)}
.mbody{padding:28px;max-height:80vh;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 28px;border-top:1px solid var(--line);flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0;cursor:pointer}
/* Toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
.verify-ok{border-left:3px solid var(--ok);padding:12px 16px;background:var(--ok-soft);border-radius:10px;margin-top:14px}
.verify-bad{border-left:3px solid var(--bad);padding:12px 16px;background:var(--bad-soft);border-radius:10px;margin-top:14px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.logo-prev{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#0b0b0b}
#print-area,#qr-tmp{display:none}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:5;height:auto;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line);background:rgba(250,248,253,.85)}
  .side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;margin:0 -16px;padding:0 16px;scrollbar-width:none}
  .nav a{padding:8px 12px;white-space:nowrap;font-size:13px}
  .nav a .n{display:none}
  main{padding:24px 16px 80px}
  .fg.c2,.fg.c3{grid-template-columns:1fr}
  .card{padding:18px}
  .item{grid-template-columns:auto 1fr 92px;gap:10px;padding:10px 12px}
  .kpi .v{font-size:24px}
}

/* ============ PRINT ============ */
@media print{
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
}
.rc{color:#111;font-family:var(--sans);background:#fff}
.rc.a4{width:100%;max-width:186mm;margin:0 auto;font-size:12.5px;position:relative}
.rc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:1.5px solid #111}
.rc .org{display:flex;gap:16px;align-items:center}
.rc .org img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#0b0b0b}
.rc .org h2{font:600 22px/1.1 var(--serif);margin:0;color:#111}
.rc .org .tag{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:4px 0 6px}
.rc .org .ad{font-size:11px;color:#555;line-height:1.45}
.rc .meta{text-align:right}
.rc .meta .lab{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#666}
.rc .meta .no{font:600 18px var(--serif);margin:6px 0 2px}
.rc .meta .dt{font-size:11px;color:#555}
.rc .ttl{font:500 28px var(--serif);margin:22px 0 4px}
.rc .ttl em{color:var(--accent)}
.rc .who{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:14px 0 18px;font-size:12px}
.rc .who div span{display:block;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#777;margin-bottom:2px}
.rc table{font-size:12px}
.rc th{color:#555;border-bottom:1px solid #111;font-size:9px}
.rc td{border-bottom:1px solid #ddd;padding:9px 8px}
.rc .tot td{border-top:1.5px solid #111;border-bottom:0;font-weight:600;font-size:14px}
.rc .words{font-style:italic;font-family:var(--serif);margin:12px 0 4px;font-size:13px}
.rc .ft{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:28px;padding-top:16px;border-top:1px solid #ddd}
.rc .qr{display:flex;gap:12px;align-items:center;font-size:10px;color:#555}
.rc .qr img{width:92px;height:92px}
.rc .sign{text-align:center;font-size:10px;color:#555;min-width:180px}
.rc .sign .ln{border-top:1px solid #111;margin-bottom:6px;margin-top:40px}
.rc .void{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.rc .void b{font:700 110px var(--serif);color:rgba(194,72,90,.18);transform:rotate(-24deg);letter-spacing:.1em}
.rc .note{font-size:10px;color:#777;margin-top:14px;text-align:center}
/* 80mm thermal */
.rc.t80{width:72mm;margin:0 auto;font-size:11px;line-height:1.4;position:relative}
.rc.t80 .c{text-align:center}
.rc.t80 img.lg{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#000}
.rc.t80 h2{font:600 15px var(--serif);margin:4px 0 0}
.rc.t80 .dash{border-top:1px dashed #000;margin:7px 0}
.rc.t80 .ln{display:flex;justify-content:space-between;gap:8px}
.rc.t80 .ln span:last-child{white-space:nowrap}
.rc.t80 .big{font-size:14px;font-weight:700}
.rc.t80 .qr80{width:110px;height:110px;margin:6px auto 0;display:block}
.rc.t80 .sm{font-size:9.5px;color:#333}
.rpt{font-size:11px;color:#111}
.rpt h2{font:600 20px var(--serif)}
.rpt table{font-size:10.5px}
.rpt td{padding:5px 6px}
</style>
<style id="page-style"></style>
</head>

<div class="orbs"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side">
    <div class="brand"><img class="mark" id="brandLogo" src="assets/logo-mark.png" alt=""><div><b id="brandName">Nilavara</b><small>Sistem Yuran</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Data disimpan dalam pelayar ini.<br>Buat backup selalu.</div>
  </aside>
  <main id="main"></main>
</div>
<div id="print-area"></div>
<div id="qr-tmp"></div>
<dialog id="modal"><div id="modalInner"></div></dialog>
<div id="toast"></div>

<script src="assets/vendor/qrcode.min.js"></script>
<script src="assets/vendor/xlsx.mini.min.js"></script>
<script>
'use strict';
/* ================== Utilities ================== */
const KEY = 'nilavara-yuran-v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const MON = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const MONF = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const pad = n => String(n).padStart(2, '0');
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const money = n => (Number(n) || 0).toLocaleString('ms-MY', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const RM = n => `${db.settings.currency} ${money(n)}`;
const fmtDate = s => { if (!s) return '—'; const [y, m, d] = s.slice(0, 10).split('-'); return `${+d} ${MON[+m - 1]} ${y}`; };
const periodLabel = p => p === 'sekali' ? 'Sekali bayar' : p === 'lain' ? '—' : /^\d{4}$/.test(p) ? `Tahun ${p}` : /^\d{4}-\d{2}$/.test(p) ? `${MONF[+p.slice(5) - 1]} ${p.slice(0, 4)}` : p;
const FREQ = {bulanan: 'Bulanan', tahunan: 'Tahunan', sekali: 'Sekali'};

// Dalam APK Android, fungsi asli disediakan melalui objek window.Android
const IS_APP = !!(window.Android && window.Android.saveFile);
const toB64 = str => { const b = new TextEncoder().encode(str); let r = ''; for (let i = 0; i < b.length; i += 0x8000) r += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(r); };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }

function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().padStart(6, '0').slice(-6); }

function terbilang(n) {
  const s = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Lapan', 'Sembilan'];
  const t = x => { x = Math.floor(x);
    if (x < 10) return s[x]; if (x === 10) return 'Sepuluh'; if (x === 11) return 'Sebelas';
    if (x < 20) return s[x - 10] + ' Belas';
    if (x < 100) return s[Math.floor(x / 10)] + ' Puluh' + (x % 10 ? ' ' + s[x % 10] : '');
    if (x < 200) return 'Seratus' + (x % 100 ? ' ' + t(x % 100) : '');
    if (x < 1000) return s[Math.floor(x / 100)] + ' Ratus' + (x % 100 ? ' ' + t(x % 100) : '');
    if (x < 2000) return 'Seribu' + (x % 1000 ? ' ' + t(x % 1000) : '');
    if (x < 1e6) return t(x / 1000) + ' Ribu' + (x % 1000 ? ' ' + t(x % 1000) : '');
    return t(x / 1e6) + ' Juta' + (x % 1e6 ? ' ' + t(x % 1e6) : '');
  };
  const r = Math.floor(n + 1e-9), c = Math.round((n - r) * 100);
  return 'Ringgit Malaysia ' + (r ? t(r) : 'Kosong') + (c ? ' Dan Sen ' + t(c) : '') + ' Sahaja';
}

/* ================== Data ================== */
function seed() {
  const y = new Date().getFullYear(), m = new Date().getMonth() + 1;
  const f1 = uid(), f2 = uid(), f3 = uid();
  const start = `${y}-01`;
  const mem = (code, name, phone, group, fees, joined = start) => ({id: uid(), code, name, phone, group, joined, status: 'aktif', fees, note: ''});
  const members = [
    mem('A001', 'Aisyah binti Rahman', '0123456789', 'Kumpulan A', [f1, f2, f3]),
    mem('A002', 'Muhammad Danial', '0197654321', 'Kumpulan A', [f1, f2]),
    mem('A003', 'Nur Iman Sofea', '0134567890', 'Kumpulan B', [f1, f3]),
    mem('A004', 'Lim Wei Jie', '0167788990', 'Kumpulan B', [f1]),

let db;
function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} const d = seed(); db = d; save(); return d; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Gagal simpan — storan penuh atau disekat. Sila buat backup.'); } }
db = load();

const fee = id => db.fees.find(f => f.id === id);
const member = id => db.members.find(m => m.id === id);
const L = () => db.settings.label || 'Ahli';
const logoSrc = () => db.settings.logo || 'assets/logo-mark.png';
const validPays = () => db.payments.filter(p => !p.void);

function nextNo(date) {
  const y = (date || today()).slice(0, 4);
  db.seq[y] = (db.seq[y] || 0) + 1;
  return `${db.settings.prefix || 'RES'}-${y}-${String(db.seq[y]).padStart(5, '0')}`;
}
function createPayment({memberId, date, method, ref, note, items}) {
  const total = items.reduce((a, i) => a + (+i.amount || 0), 0);
  const no = nextNo(date);
  const p = {id: uid(), no, date, created: new Date().toISOString(), memberId, items, total: Math.round(total * 100) / 100, method, ref, note, void: false};
  p.chk = hash(`${p.no}|${p.total.toFixed(2)}|${p.date}|${memberId}`);
  db.payments.push(p);
  save();
  return p;
}

function periodsFor(f, m, upto) {
  const start = m.joined || upto;
  if (f.freq === 'bulanan') {
    const out = []; let [y, mo] = start.split('-').map(Number); const [ey, em] = upto.split('-').map(Number); let g = 0;
    while ((y < ey || (y === ey && mo <= em)) && g++ < 240) { out.push(`${y}-${pad(mo)}`); if (++mo > 12) { mo = 1; y++; } }
    return out;
  }
  if (f.freq === 'tahunan') { const out = []; for (let y = +start.slice(0, 4); y <= +upto.slice(0, 4); y++) out.push(String(y)); return out; }
  return ['sekali'];
}
function paidSet(memberId) {
  const s = new Set();
  validPays().forEach(p => { if (p.memberId === memberId) p.items.forEach(i => s.add(i.feeId + '|' + i.period)); });
  return s;
}
function dues(m) {
  if (m.status !== 'aktif') return [];
  const ps = paidSet(m.id), now = ym(new Date()), out = [];
  (m.fees || []).forEach(fid => { const f = fee(fid); if (!f) return;
    periodsFor(f, m, now).forEach(per => { if (!ps.has(fid + '|' + per)) out.push({feeId: fid, name: f.name, period: per, amount: f.amount}); });
  });
  return out;
}
function advanceOptions(m, n = 3) {
  const ps = paidSet(m.id), out = [], d = new Date();
  (m.fees || []).forEach(fid => { const f = fee(fid); if (!f) return;
    if (f.freq === 'bulanan') for (let k = 1; k <= n; k++) { const x = new Date(d.getFullYear(), d.getMonth() + k, 1); const per = ym(x); if (!ps.has(fid + '|' + per)) out.push({feeId: fid, name: f.name, period: per, amount: f.amount}); }
    if (f.freq === 'tahunan') { const per = String(d.getFullYear() + 1); if (!ps.has(fid + '|' + per)) out.push({feeId: fid, name: f.name, period: per, amount: f.amount}); }
  });
  return out;
}

  const rows = db.members.filter(m => m.status === 'aktif' && (!g || m.group === g)).map(m => ({m, d: dues(m)})).filter(x => x.d.length).map(x => ({...x, t: x.d.reduce((a, i) => a + i.amount, 0)})).sort((a, b) => b.t - a.t);
  $('#tSum').textContent = `${rows.length} orang · ${RM(rows.reduce((a, x) => a + x.t, 0))}`;
  $('#tList').innerHTML = rows.length ? `<div class="tw"><table><thead><tr><th>${esc(L())}</th><th>Butiran</th><th class="r">Jumlah</th><th></th></tr></thead><tbody>${rows.map(({m, d, t}) => `
    <tr><td>${esc(m.name)}<span class="sub">${esc(m.code)}${m.group ? ' · ' + esc(m.group) : ''}</span></td>
    <td>${summarizeDues(d).map(s => `<span class="pill mute" style="margin:2px">${esc(s)}</span>`).join('')}</td>
    <td class="r mono" style="color:var(--gold)">${RM(t)}</td>
    <td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">${m.phone ? `<a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(m.phone, reminderText(m, d, t))}">WhatsApp</a>` : '<span class="hint">Tiada telefon</span>'}<a class="btn sm" href="#bayaran/${m.id}">Bayar</a></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Semua yuran telah dijelaskan. Syabas!</div>';
}
function summarizeDues(d) {
  const by = {}; d.forEach(x => (by[x.name] = by[x.name] || []).push(x));
  return Object.entries(by).map(([n, arr]) => arr.length === 1 ? `${n}: ${periodLabel(arr[0].period)}` : `${n} × ${arr.length} (${periodLabel(arr[0].period).replace(/ \d{4}$/, '')}–${periodLabel(arr.at(-1).period)})`);
}
function reminderText(m, d, t) {
  const list = d.map(x => `• ${x.name} — ${periodLabel(x.period)}: ${RM(x.amount)}`).join('\n');
  return (db.settings.waTemplate || '').replace(/\{nama\}/g, m.name).replace(/\{org\}/g, db.settings.org).replace(/\{senarai\}/g, list).replace(/\{jumlah\}/g, RM(t)).replace(/\{kod\}/g, m.code);
}
function waLink(phone, text) {
  let n = String(phone).replace(/\D/g, ''); if (n.startsWith('0')) n = '6' + n;
  return `https://wa.me/${n}?text=${encodeURIComponent(text)}`;
}

  const rows = [...db.payments].sort((a, b) => b.created.localeCompare(a.created)).filter(p => !q || `${p.no} ${member(p.memberId)?.name || ''}`.toLowerCase().includes(q));

}
function receiptText(p) {
  const m = member(p.memberId) || {};
  return `*${db.settings.org}* — Resit ${p.no}\nTarikh: ${fmtDate(p.date)}\nDiterima daripada: ${m.name || ''}\n\n${p.items.map(i => `• ${i.name} (${periodLabel(i.period)}): ${RM(i.amount)}`).join('\n')}\n\n*Jumlah: ${RM(p.total)}*\nKaedah: ${p.method}\nKod sah: ${p.chk}\n\n${db.settings.footer || ''}`;
}
function verify(text) {
  const t = text.trim(); const noM = t.match(/[A-Z0-9]+-\d{4}-\d{5}/i); const chkM = t.match(/SAH:\s*([A-Z0-9]{6})/i);
  if (!noM) return `<div class="verify-bad">Format no. resit tidak dikenali.</div>`;
  const p = db.payments.find(x => x.no.toUpperCase() === noM[0].toUpperCase());
  if (!p) return `<div class="verify-bad"><b>Tidak dijumpai.</b> Resit ${esc(noM[0])} tiada dalam rekod sistem ini.</div>`;
  if (chkM && chkM[1].toUpperCase() !== p.chk) return `<div class="verify-bad"><b>Kod sah tidak sepadan.</b> Kemungkinan resit telah diubah.</div>`;
  const m = member(p.memberId);
  if (p.void) return `<div class="verify-bad"><b>Resit telah DIBATALKAN.</b><br>Sebab: ${esc(p.voidReason || '—')}</div>`;
  return `<div class="verify-ok"><b>Resit sah ✓</b><br>${esc(p.no)} · ${fmtDate(p.date)}<br>${esc(m?.name || '')} · <b>${RM(p.total)}</b></div>`;
}

function paysIn(from, to) { return validPays().filter(p => p.date >= from && p.date <= to).sort((a, b) => a.date.localeCompare(b.date) || a.no.localeCompare(b.no)); }
function reportData() {
  const from = $('#rFrom').value, to = $('#rTo').value, rows = paysIn(from, to);

  rows.forEach(p => { byMethod[p.method] = (byMethod[p.method] || 0) + p.total; p.items.forEach(i => byFee[i.name] = (byFee[i.name] || 0) + (+i.amount)); });
  return {from, to, rows, byMethod, byFee, total: rows.reduce((a, p) => a + p.total, 0)};
}
function renderReport() {

}
function exportXLSX() {
  const r = reportData();
  const pay = r.rows.map(p => { const m = member(p.memberId) || {}; return {'No. Resit': p.no, 'Tarikh': p.date, 'Kod': m.code, 'Nama': m.name, 'Kumpulan': m.group, 'Kaedah': p.method, 'Rujukan': p.ref, 'Jumlah (RM)': p.total, 'Catatan': p.note}; });
  const det = r.rows.flatMap(p => p.items.map(i => ({'No. Resit': p.no, 'Tarikh': p.date, 'Nama': member(p.memberId)?.name, 'Item': i.name, 'Tempoh': periodLabel(i.period), 'Amaun (RM)': +i.amount})));
  const sum = [{Perkara: 'Tempoh', Nilai: `${r.from} hingga ${r.to}`}, {Perkara: 'Jumlah kutipan (RM)', Nilai: r.total}, {Perkara: 'Bil. resit', Nilai: r.rows.length}, {}, ...Object.entries(r.byFee).map(([k, v]) => ({Perkara: 'Yuran: ' + k, Nilai: v})), {}, ...Object.entries(r.byMethod).map(([k, v]) => ({Perkara: 'Kaedah: ' + k, Nilai: v}))];
  const owe = db.members.filter(m => m.status === 'aktif').flatMap(m => dues(m).map(d => ({'Kod': m.code, 'Nama': m.name, 'Kumpulan': m.group, 'Telefon': m.phone, 'Yuran': d.name, 'Tempoh': periodLabel(d.period), 'Amaun (RM)': d.amount})));
  const fname = `Laporan-Yuran-${r.from}_${r.to}`;
  if (typeof XLSX === 'undefined') { // offline fallback
    const csv = [Object.keys(pay[0] || {'No. Resit': ''}).join(','), ...pay.map(o => Object.values(o).map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
    download('﻿' + csv, fname + '.csv', 'text/csv'); toast('Excel tidak dapat dimuat (offline) — dieksport sebagai CSV.'); return;
  }
  const wb = XLSX.utils.book_new();
  const add = (data, name, cols) => { const ws = XLSX.utils.json_to_sheet(data.length ? data : [{'-': 'Tiada data'}]); ws['!cols'] = cols.map(w => ({wch: w})); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(sum, 'Ringkasan', [34, 24]); add(pay, 'Bayaran', [18, 12, 8, 28, 14, 16, 14, 12, 20]); add(det, 'Butiran Item', [18, 12, 28, 22, 18, 12]); add(owe, 'Tunggakan', [8, 28, 14, 14, 22, 18, 12]);
  if (IS_APP) { window.Android.saveFile(fname + '.xlsx', XLSX.write(wb, {bookType: 'xlsx', type: 'base64'}), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); return; }
  XLSX.writeFile(wb, fname + '.xlsx'); toast('Fail Excel dimuat turun.');
}

function printReceipt(id, size) {
  const p = db.payments.find(x => x.id === id); if (!p) return;
  doPrint(receiptHTML(p, size), size === '80' ? '@page{size:80mm auto;margin:3mm}' : '@page{size:A4;margin:14mm}', 'Resit ' + p.no, size === '80' ? '80' : 'a4');
}
function printReport() {
  const r = reportData(), s = db.settings;
  doPrint(`<div class="rc a4 rpt"><div class="hd"><div class="org"><img src="${esc(logoSrc())}" alt=""><div><h2>${esc(s.org)}</h2><div class="tag">Laporan Kutipan Yuran</div><div class="ad">${fmtDate(r.from)} – ${fmtDate(r.to)}</div></div></div><div class="meta"><div class="lab">Jumlah</div><div class="no">${RM(r.total)}</div><div class="dt">${r.rows.length} resit</div></div></div>
  <table style="margin-top:16px"><thead><tr><th>Tarikh</th><th>No. resit</th><th>${esc(L())}</th><th>Kaedah</th><th class="r">Jumlah</th></tr></thead><tbody>${r.rows.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${esc(p.no)}</td><td>${esc(member(p.memberId)?.name || '')}</td><td>${esc(p.method)}</td><td class="r">${money(p.total)}</td></tr>`).join('')}<tr class="tot"><td colspan="4">JUMLAH</td><td class="r">${money(r.total)}</td></tr></tbody></table>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px"><table><thead><tr><th>Jenis yuran</th><th class="r">RM</th></tr></thead><tbody>${Object.entries(r.byFee).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${money(v)}</td></tr>`).join('')}</tbody></table><table><thead><tr><th>Kaedah</th><th class="r">RM</th></tr></thead><tbody>${Object.entries(r.byMethod).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${money(v)}</td></tr>`).join('')}</tbody></table></div>
  <div class="note">Dicetak pada ${fmtDate(today())}</div></div>`, '@page{size:A4;margin:12mm}', 'Laporan Yuran', 'a4');
}
function download(content, name, type) { if (IS_APP) { window.Android.saveFile(name, toB64(content), type); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function resizeImage(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const S = 320, c = document.createElement('canvas'); const k = Math.min(1, S / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.onerror = rej; img.src = fr.result; }; fr.onerror = rej; fr.readAsDataURL(file); });
}

/* ================== Events ================== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'close') return closeModal();
  if (act === 'memberForm') return memberForm(id);
  if (act === 'feeForm') return feeForm(id);
  if (act === 'print') return printReceipt(id, b.dataset.size);
  if (act === 'addCustom') {
    const i = payState.items.length; payState.items.push({feeId: 'lain', name: '', period: 'lain', amount: 0, on: true});
    const el = document.createElement('div'); el.className = 'item on';
    el.innerHTML = `<input type="checkbox" checked data-i="${i}"><input placeholder="Perkara (cth: Baju, Buku)" data-name="${i}" style="padding:8px 10px"><input type="number" step="0.01" min="0" value="0" data-amt="${i}">`;
    $('#customItems').appendChild(el); el.querySelector('[data-name]').focus(); return;
  }
  if (act === 'delMember') {
    const used = db.payments.some(p => p.memberId === id);
    if (used) { if (confirm('Rekod ini ada sejarah bayaran, jadi tidak boleh dipadam. Tukar status kepada Tidak aktif?')) { member(id).status = 'tidak'; save(); closeModal(); listMembers(); } return; }
    if (confirm('Padam rekod ini?')) { db.members = db.members.filter(m => m.id !== id); save(); closeModal(); listMembers(); toast('Dipadam.'); } return;
  }
  if (act === 'delFee') {
    if (!confirm('Padam jenis yuran ini? Ia akan dikeluarkan daripada semua ' + L().toLowerCase() + '. Resit lama tidak terjejas.')) return;
    db.fees = db.fees.filter(f => f.id !== id); db.members.forEach(m => m.fees = (m.fees || []).filter(x => x !== id)); save(); closeModal(); route(); return;
  }
  if (act === 'void') {
    const p = db.payments.find(x => x.id === id);
    openModal(`<form id="voidForm" data-id="${id}"><div class="mbody"><span class="eyebrow" style="display:block">Pembatalan</span><h2 style="margin:10px 0 8px">Batal <em>${esc(p.no)}</em>?</h2><p class="hint">Resit kekal dalam rekod dengan tanda BATAL. Yuran berkaitan akan kembali menjadi tunggakan.</p><label style="margin-top:16px">Sebab</label><input name="reason" required placeholder="cth: Salah amaun"></div><div class="mfoot"><button type="button" class="btn" data-act="close">Tidak</button><button class="btn pri" style="background:var(--bad);border-color:var(--bad)">Batalkan resit</button></div></form>`); return;
  }
  if (act === 'range') {
    const d = new Date(), r = b.dataset.r;
    $('#rFrom').value = r === 'today' ? today() : r === 'month' ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01` : `${d.getFullYear()}-01-01`;
    $('#rTo').value = today(); renderReport(); return;
  }
  if (act === 'xlsx') return exportXLSX();
  if (act === 'printReport') return printReport();
  if (act === 'backup') { download(JSON.stringify(db, null, 1), `backup-yuran-${today()}.json`, 'application/json'); toast('Backup dimuat turun.'); return; }
  if (act === 'resetLogo') { db.settings.logo = null; save(); $('#logoPrev').src = logoSrc(); renderNav('tetapan'); return; }
  if (act === 'wipe') {
    if (prompt('Semua data akan dipadam kekal. Taip PADAM untuk teruskan.') !== 'PADAM') return;
    const s = db.settings; db = {v: 1, settings: s, fees: db.fees, members: [], payments: [], seq: {}}; save(); route(); toast('Data dikosongkan. Tetapan & jenis yuran dikekalkan.'); return;
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'pMember') return buildItems();
  if (t.closest('#pItems')) return recalc();
  if (t.id === 'mGroup') return listMembers();
  if (t.id === 'tGroup') return listDues();
  if (t.id === 'rFrom' || t.id === 'rTo') return renderReport();
  if (t.id === 'logoFile' && t.files[0]) {
    try { db.settings.logo = await resizeImage(t.files[0]); save(); $('#logoPrev').src = logoSrc(); renderNav('tetapan'); toast('Logo dikemaskini.'); } catch { toast('Gagal baca imej.'); }
  }
  if (t.id === 'restoreFile' && t.files[0]) {
    try { const d = JSON.parse(await t.files[0].text()); if (!d.settings || !Array.isArray(d.members) || !Array.isArray(d.payments)) throw 0;
      if (!confirm(`Pulihkan backup? (${d.members.length} rekod, ${d.payments.length} resit). Data semasa akan diganti.`)) return;
      db = d; db.seq = db.seq || {}; save(); route(); toast('Backup dipulihkan.');
    } catch { toast('Fail backup tidak sah.'); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest('#pItems') && t.type === 'number') recalc();
  if (t.id === 'mSearch') listMembers();
  if (t.id === 'rSearch') listReceipts();
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'payForm') {
    const m = member($('#pMember').value); if (!m) return toast('Sila pilih ' + L().toLowerCase() + '.');
    const items = [];
    $$('#pItems .item').forEach(el => { const cb = el.querySelector('input[type=checkbox]'); if (!cb.checked) return; const i = +cb.dataset.i, it = payState.items[i]; const amt = Math.round((+el.querySelector('input[type=number]').value || 0) * 100) / 100; const nm = el.querySelector('[data-name]'); const name = nm ? nm.value.trim() : it.name; if (!name || amt <= 0) return; items.push({feeId: it.feeId, name, period: it.period, amount: amt}); });
    if (!items.length) return toast('Tiada item dengan amaun yang sah.');
    const p = createPayment({memberId: m.id, date: $('#pDate').value || today(), method: $('#pMethod').value, ref: $('#pRef').value.trim(), note: $('#pNote').value.trim(), items});
    openModal(`<div class="mbody" style="text-align:center"><span class="eyebrow" style="display:block">Bayaran direkod</span><h2 style="margin:12px 0 4px;font-size:30px">Resit <em>${esc(p.no)}</em></h2><p class="lede" style="margin:0 auto">${esc(m.name)} · <b class="mono">${RM(p.total)}</b></p>
      <div class="row" style="justify-content:center;margin-top:24px"><button class="btn pri" data-act="print" data-id="${p.id}" data-size="a4">Cetak A4</button><button class="btn" data-act="print" data-id="${p.id}" data-size="80">Cetak 80mm</button>${m.phone ? `<a class="btn wa" target="_blank" rel="noopener" href="${waLink(m.phone, receiptText(p))}">Hantar WhatsApp</a>` : ''}</div></div>
      <div class="mfoot"><button class="btn ghost" data-act="close">Tutup</button></div>`);
    $('#modal').addEventListener('close', () => { payState.memberId = ''; if (location.hash === '#bayaran') route(); else if (location.hash.startsWith('#bayaran/')) location.hash = '#bayaran'; }, {once: true});
    return;
  }
  if (f.id === 'memberForm') {
    const fd = new FormData(f), id = f.dataset.id;
    const code = fd.get('code').trim();
    if (db.members.some(m => m.code.toLowerCase() === code.toLowerCase() && m.id !== id)) return toast('Kod sudah digunakan.');
    const data = {code, name: fd.get('name').trim(), phone: fd.get('phone').trim(), group: fd.get('group').trim(), joined: fd.get('joined'), status: fd.get('status'), fees: fd.getAll('fees'), note: fd.get('note').trim()};
    if (id) Object.assign(member(id), data); else db.members.push({id: uid(), ...data});
    save(); closeModal(); route(); toast('Disimpan.'); return;
  }
  if (f.id === 'feeForm') {
    const fd = new FormData(f), id = f.dataset.id, data = {name: fd.get('name').trim(), amount: Math.round(+fd.get('amount') * 100) / 100, freq: fd.get('freq')};
    if (id) Object.assign(fee(id), data); else db.fees.push({id: uid(), ...data});
    save(); closeModal(); route(); toast('Jenis yuran disimpan.'); return;
  }
  if (f.id === 'voidForm') {
    const p = db.payments.find(x => x.id === f.dataset.id); p.void = true; p.voidReason = new FormData(f).get('reason'); p.voidAt = new Date().toISOString();
    save(); closeModal(); listReceipts(); toast('Resit dibatalkan.'); return;
  }
  if (f.id === 'setForm') {
    const fd = new FormData(f);
    ['org', 'tagline', 'address', 'phone', 'email', 'label', 'prefix', 'footer', 'waTemplate'].forEach(k => db.settings[k] = String(fd.get(k) || '').trim());
    db.settings.prefix = db.settings.prefix.toUpperCase();
    save(); route(); toast('Tetapan disimpan.'); return;
  }
  if (f.id === 'verifyForm') { $('#vOut').innerHTML = verify($('#vText').value); return; }
});

// Butang Back Android: tutup modal dahulu, kemudian kembali ke halaman Utama
window.__back = () => {
  if ($('#modal').open) { closeModal(); return 1; }
  if ((location.hash || '#utama') !== '#utama') { location.hash = '#utama'; return 1; }
  return 0;
};
// Pasang sebagai aplikasi (PWA) & guna tanpa internet bila dibuka melalui pautan web
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

route();
</script>
